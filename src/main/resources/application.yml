spring:
  application:
    name: upi-ledger

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/upiledger}
    username: ${DB_USERNAME:upiledger}
    password: ${DB_PASSWORD:upiledger}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  error:
    include-message: never
    include-binding-errors: never
